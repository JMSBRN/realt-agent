<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Realt Agent</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <h1>Realt Agent</h1>
    <p id="state">…</p>

    <form id="settings">
      <label>
        Адрес сервера
        <input id="serverUrl" placeholder="ws://127.0.0.1:8765" required />
      </label>
      <label>
        Токен (WS_TOKEN из .env сервера)
        <input id="token" type="password" required />
      </label>
      <button>Сохранить и подключиться</button>
    </form>

    <p class="muted">Держите Chrome открытым — поиск запускается сам, когда вы пишете боту.</p>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
